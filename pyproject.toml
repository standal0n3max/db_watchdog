[project]
name = "db-pipeline"
version = "0.1.0"
description = "Сборщик экземпляров ядра DuckDB для того же pg-gym"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apache-airflow==2.11.0",
    "beartype>=0.20.0",
    "mcp>=1.9.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
]

[tool.uv]
constraint-dependencies = ["cryptography==42.0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_pipeline"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests", "dags"]
exclude = ["^data/", "^runs/", "^\\.venv/"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests", "dags"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
